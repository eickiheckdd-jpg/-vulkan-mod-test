buildscript {
    repositories {
        maven { url "https://maven.fabricmc.net/" }
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath 'net.fabricmc:fabric-loom:1.14.10'
    }
}

apply plugin: 'fabric-loom'
apply plugin: 'maven-publish'

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url "https://maven.fabricmc.net/" }
    mavenCentral()
    gradlePluginPortal()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // LWJGL Vulkan bindings are not bundled with Minecraft by default.
    // Declare them so the mod builds. Loom will strip them from the
    // final JAR because Minecraft provides LWJGL at runtime.
    compileOnly "org.lwjgl:lwjgl-vulkan:3.3.3"
    runtimeOnly "org.lwjgl:lwjgl-vulkan:3.3.3"

    // Mixin compile/runtime dependency (matches Fabric Loom's bundled version)
    compileOnly "net.fabricmc:sponge-mixin:0.16.5+mixin.0.8.7"
    modCompileOnly "net.fabricmc:sponge-mixin:0.16.5+mixin.0.8.7"
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release.set(21)
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archivesBaseName}" }
    }
}
