name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: java -version
      - run: ./gradlew clean build
      - uses: actions/upload-artifact@v4
        with:
          name: vulkanmod-build
          path: build/libs/*.jar
