name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Show toolchain versions
        run: |
          java -version
          ./gradlew --version

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew clean build --stacktrace --info

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vulkanmod-build
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Upload full build log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: |
            build/reports/
            **/build/tmp/**/*.log
          if-no-files-found: ignore