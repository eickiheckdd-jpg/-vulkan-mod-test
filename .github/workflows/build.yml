name: Build VulkanMod

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.11'

      - name: Verify Gradle
        run: gradle --version

      - name: Build with Gradle
        run: gradle build --no-daemon --info

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: vulkanmod-jar
          path: build/libs/*.jar
          retention-days: 14
